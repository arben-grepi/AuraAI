name: Run Tests on PR

on:
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "21"

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm run test

      - name: Fail the PR if tests fail
        if: failure()
        run: exit 1
